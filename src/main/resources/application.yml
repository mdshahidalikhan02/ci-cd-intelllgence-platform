spring:
  application:
    name: cicd-failure-intelligence
  
  datasource:
    url: jdbc:postgresql://localhost:5432/cicd_db
    username: platform_user
    password: platform_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: cicd-intelligence-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:mock-key-for-local-dev}
    vectorstore:
      pgvector:
        table-name: incident_runbooks
        dimensions: 1536
        distance-type: COSINE

app:
  kafka:
    topics:
      failure-events: cicd.failure.events
