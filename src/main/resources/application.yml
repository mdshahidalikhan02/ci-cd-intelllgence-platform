spring:
  application:
    name: cicd-failure-intelligence

  datasource:
    url: jdbc:postgresql://localhost:5433/cicd_db
    username: platform_user
    password: platform_password

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: cicd-intelligence-group
      auto-offset-reset: earliest

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:mock-key-for-local-dev}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
      embedding:
        options:
          model: text-embedding-3-small   # 1536 dimensions, matches vector(1536) in schema.sql
    vectorstore:
      pgvector:
        table-name: incident_runbooks
        dimensions: 1536
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        initialize-schema: false          # schema.sql owns the table

app:
  kafka:
    topics:
      failure-events: cicd.failure.events
  outbox:
    poll-interval-ms: 2000
    max-retries: 3
  runbooks:
    seed-on-startup: true
